name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: gofmt -l cmd internal tests | tee /dev/stderr | test ! -s /dev/stdin
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/... ./tests/...
      - run: GOOS=linux GOARCH=${{ matrix.arch }} go build -o dist/shiro-linux-${{ matrix.arch }} ./cmd/shiro
